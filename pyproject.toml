[project]
name = "voziris"
version = "0.1.0"
description = "Dictado por voz para Windows, con motor local sin GPU y motor por API"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Alfonso Juan Sanz López" }]

dependencies = [
    "onnx-asr[cpu,hub]>=0.6",   # motor local: Parakeet TDT v3 en ONNX, sin PyTorch
    "sounddevice>=0.4.7",       # captura de audio
    "numpy>=1.26,<3",
    "httpx>=0.27",              # cliente de la API
    "tomlkit>=0.13",            # config.toml conservando comentarios
    "pystray>=0.19",            # icono de bandeja
    "pillow>=10",               # requerido por pystray
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
vad = ["onnxruntime>=1.18"]     # silero-vad se descarga como modelo, no como paquete
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.10",
]
banco = ["faster-whisper>=1.0", "psutil>=6", "soundfile>=0.12"]  # solo para tools/banco_h0.py

[project.scripts]
voziris = "voziris.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voziris"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"  # numpy >= 2.4 usa `type X = ...` en sus stubs; en 3.11 pip instala numpy < 2.4
strict = true
files = ["src/voziris"]
# Estas bibliotecas no traen stubs de tipos
[[tool.mypy.overrides]]
module = [
    "sounddevice.*", "pystray.*", "onnx_asr.*", "onnxruntime.*", "huggingface_hub.*",
    "win32.*", "win32clipboard.*", "win32con", "win32gui", "win32api",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "audio: necesita un micrófono real (se salta si no hay dispositivo de entrada)",
    "win: necesita Windows con sesión interactiva (hook de teclado, portapapeles, ventanas)",
    "modelo: necesita el modelo local descargado en ./modelos",
    "red: necesita red y GROQ_API_KEY; cuesta dinero",
]
